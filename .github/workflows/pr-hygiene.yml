name: PR hygiene

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-hygiene-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  pr-hygiene:
    name: PR hygiene
    permissions:
      contents: read
      pull-requests: write # labeler + stale jobs comment/label PRs
      issues: write # stale job manages issues
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/pr-hygiene.yml@4b53916e8a7b1c2dd220766b6dd4170a843f622e # 0.2.0-dev
    # This reusable exposes no `runner` input at the pinned commit; the
    # hosted-runner rule therefore does not apply here. Re-check on a pin bump.
    with:
      # The reusable commitlint job (wagoid v6.2.1) fails with EISDIR here; keep
      # pr-title/labeler/stale and re-enable once ci-workflows fixes commitlint.
      commitlint: false

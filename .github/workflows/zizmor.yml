name: zizmor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  zizmor:
    name: Workflow security analysis
    permissions:
      # zizmor-sarif reads workflow run metadata from the Actions API. A caller
      # cannot grant a reusable more than it declares itself, so omitting
      # actions: read fails the run at startup before any job begins — which is
      # exactly what the 0.12.0 -> 0.13.3 repin surfaced here.
      actions: read
      contents: read
      security-events: write # SARIF upload to the Security tab
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/zizmor-sarif.yml@1e32920e80393d07318c611273ffba0fa7859a35 # 0.2.0-dev
    with:
      # Public repo: pull_request runs untrusted fork code. Pin the hosted runner
      # explicitly. The estate runner platform forbids public/fork code on a
      # trusted runner group (modules/github-actions, docs/threat-model.md),
      # and this repository is public. The reusable's default belongs to the
      # pinned commit, not here. A wrong value does not fail loudly either:
      # a job asking for a label no runner advertises queues indefinitely.
      runner: ubuntu-latest

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Hosted CI validates plan mode only; apply belongs on a disposable
          target VM.
        required: true
        default: plan
        type: choice
        options:
        - plan
      platform:
        description: Run target platform(s) on matrix.
        required: true
        default: both
        type: choice
        options:
        - both
        - macos
        - ubuntu

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Obsolete pull-request heads are cancelled; a running main validation always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bootstrap-script-lint:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    name: bootstrap-script-lint-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - macos-26
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Prepare validation tools
      run: |
        if [ "${{ matrix.os }}" = "macos-26" ]; then
          brew update
          brew install shellcheck ripgrep
        else
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck ripgrep
        fi
    - name: Lint bootstrap scripts
      run: |
        bash scripts/ci/lint.sh
  bootstrap-validate:
    needs:
    - bootstrap-script-lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    name: bootstrap-${{ matrix.platform }}-${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'plan' }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          platform: ubuntu
        - os: macos-26
          platform: macos
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Prepare validation tools
      if: github.event_name != 'workflow_dispatch' || inputs.platform == 'both' || inputs.platform == matrix.platform
      run: "case \"${{ matrix.os }}\" in\n  macos*) \n    brew update\n    brew install shellcheck ripgrep\n    ;;\n  *)\n    sudo apt-get update\n    sudo apt-get install -y --no-install-recommends shellcheck\
        \ ripgrep\n    ;;\nesac\n"
    - name: Validate bootstrap scripts (syntax + shellcheck + contract + dry-runs)
      if: github.event_name != 'workflow_dispatch' || inputs.platform == 'both' || inputs.platform == matrix.platform
      run: |
        bash scripts/ci/validate.sh
    - name: Verify the repository metadata contract
      if: github.event_name != 'workflow_dispatch' || inputs.platform == 'both' || inputs.platform == matrix.platform
      run: |
        set -euo pipefail
        for path in README.md LICENSE NOTICE VERSION; do
          [ -r "$path" ] || { echo "missing required path: $path" >&2; exit 1; }
        done
        version="$(tr -d '[:space:]' <VERSION)"
        [ -n "$version" ] || { echo "VERSION is empty" >&2; exit 1; }
        printf 'metadata contract ok on %s: version %s\n' "$(uname -s)" "$version"
    - name: Verify bootstrap entrypoint for target platform
      if: github.event_name != 'workflow_dispatch' || inputs.platform == 'both' || inputs.platform == matrix.platform
      run: |
        args=(--profile desktop)
        if [ "${{ matrix.platform }}" = "ubuntu" ]; then
          args+=(--no-gui)
        fi
        bash scripts/bootstrap.sh --platform "${{ matrix.platform }}" "${args[@]}" --plan --skip-checks
  bootstrap-dryrun-crosscheck:
    needs:
    - bootstrap-validate
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'plan'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    name: bootstrap-crosscheck-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          platform: ubuntu
          cross_platform: macos
        - os: macos-26
          platform: macos
          cross_platform: ubuntu
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Crosscheck other platform installer in plan mode
      if: github.event_name != 'workflow_dispatch' || inputs.platform == 'both' || inputs.platform == matrix.platform
      run: |
        args=(--profile desktop --no-gui)
        bash scripts/bootstrap.sh --platform "${{ matrix.cross_platform }}" "${args[@]}" --plan --skip-system --skip-checks
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/tools@9cc44a5043ddd266f3e73fefacc52f5cf5a7d70f # nddev-cicd-v0.6.18
        with:
          capability: security
      - name: Lint and audit workflows
        run: |
          actionlint .github/workflows/ci.yml .github/workflows/dependency-check.yml .github/workflows/docs-quality.yml .github/workflows/osv-scan.yml .github/workflows/platform-evidence.yml .github/workflows/pytest.yml .github/workflows/semgrep.yml .github/workflows/source-drift.yml .github/workflows/security.yml
          zizmor --offline --no-progress .github/workflows/ci.yml .github/workflows/dependency-check.yml .github/workflows/docs-quality.yml .github/workflows/osv-scan.yml .github/workflows/platform-evidence.yml .github/workflows/pytest.yml .github/workflows/semgrep.yml .github/workflows/source-drift.yml .github/workflows/security.yml .github/dependabot.yml
      - name: Scan new pull request commits, or the full history on main
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then
            gitleaks git --no-banner --redact --log-opts="$BASE..$HEAD" .
          else
            gitleaks git --no-banner --redact .
          fi

  required-contexts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: required-contexts
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Live ruleset, mirror and anchor must agree
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/ci/check_required_contexts.py --live
  bootstrap-gate:
    needs:
    - bootstrap-script-lint
    - bootstrap-validate
    - bootstrap-dryrun-crosscheck
    - workflow-lint
    - required-contexts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: always()
    steps:
    - name: Bootstrap CI gate
      run: |
        echo "Checking required bootstrap workflow jobs"
        echo "mode=plan"

        if [[ "${{ needs.bootstrap-script-lint.result }}" != "success" ]]; then
          echo "bootstrap-script-lint: ${{ needs.bootstrap-script-lint.result }}" >&2
          exit 1
        fi

        if [[ "${{ needs.bootstrap-validate.result }}" != "success" ]]; then
          echo "bootstrap-validate: ${{ needs.bootstrap-validate.result }}" >&2
          exit 1
        fi

        if [[ "${{ needs.workflow-lint.result }}" != "success" ]]; then
          echo "workflow-lint: ${{ needs.workflow-lint.result }}" >&2
          exit 1
        fi

        if [[ "${{ needs.required-contexts.result }}" != "success" ]]; then
          echo "required-contexts: ${{ needs.required-contexts.result }}" >&2
          exit 1
        fi

        if [[ "${{ needs.bootstrap-dryrun-crosscheck.result }}" != "success" ]]; then
          echo "bootstrap-dryrun-crosscheck: ${{ needs.bootstrap-dryrun-crosscheck.result }}" >&2
          exit 1
        fi

        echo "bootstrap-gate passed"

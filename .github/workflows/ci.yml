name: bootstrap-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "Hosted CI validates plan mode only; apply belongs on a disposable target VM."
        required: true
        default: plan
        type: choice
        options:
          - plan
      platform:
        description: "Run target platform(s) on matrix."
        required: true
        default: both
        type: choice
        options:
          - both
          - macos
          - ubuntu

permissions:
  contents: read

concurrency:
  group: bootstrap-ci-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  bootstrap-script-lint:
    runs-on: ${{ matrix.os }}
    name: bootstrap-script-lint-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare validation tools
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            brew update
            brew install shellcheck ripgrep
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends shellcheck ripgrep
          fi

      - name: Lint bootstrap scripts
        run: |
          bash scripts/ci/lint.sh

  bootstrap-validate:
    needs: bootstrap-script-lint
    runs-on: ${{ matrix.os }}
    name: bootstrap-${{ matrix.platform }}-${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'plan' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: ubuntu
          - os: macos-latest
            platform: macos
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare validation tools
        if: github.event_name != 'workflow_dispatch' || inputs.platform == 'both' || inputs.platform == matrix.platform
        run: |
          case "${{ matrix.os }}" in
            macos*) 
              brew update
              brew install shellcheck ripgrep
              ;;
            *)
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends shellcheck ripgrep
              ;;
          esac

      - name: Validate bootstrap scripts (syntax + shellcheck + contract + dry-runs)
        if: github.event_name != 'workflow_dispatch' || inputs.platform == 'both' || inputs.platform == matrix.platform
        run: |
          bash scripts/ci/validate.sh

      # The repository-metadata contract, on both supported operating systems.
      #
      # This is what `cross-platform.yml` proved, through two required status
      # checks and two runner starts on every push, pull request and weekly
      # schedule: that four files exist and `VERSION` is readable. Both jobs ran
      # the same block; neither ran a line of this adapter. A platform-specific
      # regression passed both.
      #
      # It is a real invariant -- every consumer resolves the adapter by these
      # four files -- so it is kept, folded into a job that already runs on both
      # platforms and already has to be green to merge. Two required contexts
      # become zero, and the assertion gets stronger: it now runs beside the
      # lanes that execute the installers.
      - name: Verify the repository metadata contract
        if: github.event_name != 'workflow_dispatch' || inputs.platform == 'both' || inputs.platform == matrix.platform
        run: |
          set -euo pipefail
          for path in README.md LICENSE NOTICE VERSION; do
            [ -r "$path" ] || { echo "missing required path: $path" >&2; exit 1; }
          done
          version="$(tr -d '[:space:]' <VERSION)"
          [ -n "$version" ] || { echo "VERSION is empty" >&2; exit 1; }
          printf 'metadata contract ok on %s: version %s\n' "$(uname -s)" "$version"

      - name: Verify bootstrap entrypoint for target platform
        if: github.event_name != 'workflow_dispatch' || inputs.platform == 'both' || inputs.platform == matrix.platform
        run: |
          args=(--profile desktop)
          if [ "${{ matrix.platform }}" = "ubuntu" ]; then
            args+=(--no-gui)
          fi
          bash scripts/bootstrap.sh --platform "${{ matrix.platform }}" "${args[@]}" --plan --skip-checks

  bootstrap-dryrun-crosscheck:
    needs: bootstrap-validate
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'plan'
    runs-on: ${{ matrix.os }}
    name: bootstrap-crosscheck-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: ubuntu
            cross_platform: macos
          - os: macos-latest
            platform: macos
            cross_platform: ubuntu
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Crosscheck other platform installer in plan mode
        if: github.event_name != 'workflow_dispatch' || inputs.platform == 'both' || inputs.platform == matrix.platform
        run: |
          args=(--profile desktop --no-gui)
          bash scripts/bootstrap.sh --platform "${{ matrix.cross_platform }}" "${args[@]}" --plan --skip-system --skip-checks

  # This lane feeds the required `bootstrap-gate`, and it used to acquire its
  # linter mutably: `raven-actions/actionlint` was pinned to a commit, but that
  # action's `version` input defaults to `latest` and it verifies no checksum.
  # Pinning the wrapper and letting it resolve whatever bytes are newest is not
  # a content-addressed supply chain -- the same repository commit could lint
  # with a different program tomorrow, in the one check that must be green to
  # merge.
  #
  # The checksum-bound implementation already existed in `ci-workflows` and was
  # already what `actionlint.yml` called -- but that workflow was not a required
  # context, so the repository ran the strong lane advisorily and the weak lane
  # as its gate. `actionlint.yml` is deleted with this change; keeping two
  # implementations of one check is how they drift.
  #
  # Version and digest come from `config/rldyour-contract.json`, the same values
  # a device installs, and `scripts/ci/check_ci_tool_parity.py` fails if they
  # drift apart.
  workflow-lint:
    permissions:
      contents: read
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/actionlint.yml@4b53916e8a7b1c2dd220766b6dd4170a843f622e # 0.2.0-dev
    with:
      # Public repo: pull_request runs untrusted fork code. Pin the hosted runner
      # explicitly. The estate runner platform forbids public/fork code on a
      # trusted runner group (modules/github-actions, docs/threat-model.md),
      # and this repository is public. The reusable's default belongs to the
      # pinned commit, not here. A wrong value does not fail loudly either:
      # a job asking for a label no runner advertises queues indefinitely.
      runner: ubuntu-latest
      actionlint_version: '1.7.12'
      actionlint_sha256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'

  # Proves the three statements of what protects `main` are one list: the live
  # ruleset, the checked-in mirror, and `.gds/repository.yaml`. It reaches the
  # API, so it is its own job rather than a step inside a matrix that would run
  # it twice, and it joins `bootstrap-gate` rather than becoming an eighth
  # required context -- the gate is the aggregation point that already exists.
  required-contexts:
    runs-on: ubuntu-latest
    name: required-contexts
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Live ruleset, mirror and anchor must agree
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/check_required_contexts.py --live

  bootstrap-gate:
    needs: [bootstrap-script-lint, bootstrap-validate, bootstrap-dryrun-crosscheck, workflow-lint, required-contexts]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Bootstrap CI gate
        run: |
          echo "Checking required bootstrap workflow jobs"
          echo "mode=plan"

          if [[ "${{ needs.bootstrap-script-lint.result }}" != "success" ]]; then
            echo "bootstrap-script-lint: ${{ needs.bootstrap-script-lint.result }}" >&2
            exit 1
          fi

          if [[ "${{ needs.bootstrap-validate.result }}" != "success" ]]; then
            echo "bootstrap-validate: ${{ needs.bootstrap-validate.result }}" >&2
            exit 1
          fi

          if [[ "${{ needs.workflow-lint.result }}" != "success" ]]; then
            echo "workflow-lint: ${{ needs.workflow-lint.result }}" >&2
            exit 1
          fi

          if [[ "${{ needs.required-contexts.result }}" != "success" ]]; then
            echo "required-contexts: ${{ needs.required-contexts.result }}" >&2
            exit 1
          fi

          if [[ "${{ needs.bootstrap-dryrun-crosscheck.result }}" != "success" ]]; then
            echo "bootstrap-dryrun-crosscheck: ${{ needs.bootstrap-dryrun-crosscheck.result }}" >&2
            exit 1
          fi

          echo "bootstrap-gate passed"

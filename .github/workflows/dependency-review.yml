name: dependency-review

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  review:
    name: dependency-review
    permissions:
      contents: read
      pull-requests: write
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/public-dependency-review.yml@4b53916e8a7b1c2dd220766b6dd4170a843f622e # 0.2.0-dev
    with:
      # Public repo: pull_request runs untrusted fork code. Pin the hosted runner
      # explicitly — the reusable's `runner` default belongs to the pinned commit,
      # not to this repository, so inheriting it would let a pin bump move fork
      # PRs onto trusted private infrastructure with no diff here to review.
      runner: ubuntu-latest
      fail_on_severity: high
      vulnerability_check: true

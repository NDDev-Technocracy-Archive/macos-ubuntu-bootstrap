name: docs-quality
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  docs-quality:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@a12acfc75fd7daee2fac9a246ee60683fe18955b # v0.6.67
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-24.04
      recipe: links
      fetch-depth: 0
      timeout-minutes: 15
      tool-assets: .github/ci-tools.json

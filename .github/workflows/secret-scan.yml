name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * 3"
  workflow_dispatch:

permissions: {}

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  gitleaks:
    name: Gitleaks secret scan
    permissions:
      contents: read
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/secret-scan.yml@1e32920e80393d07318c611273ffba0fa7859a35 # 0.2.0-dev
    with:
      # Public repo: pull_request runs untrusted fork code. Pin the hosted runner
      # explicitly. The estate runner platform forbids public/fork code on a
      # trusted runner group (modules/github-actions, docs/threat-model.md),
      # and this repository is public. The reusable's default belongs to the
      # pinned commit, not here. A wrong value does not fail loudly either:
      # a job asking for a label no runner advertises queues indefinitely.
      runner: ubuntu-latest
      # One narrowly-scoped allowlist: Google's public Chrome signing-key
      # fingerprint, which `generic-api-key` matches because it is forty hex
      # characters in a name containing KEY. Allowlisted by exact value, so a
      # real credential in the same files is still caught.
      gitleaks_config_path: .gitleaks.toml

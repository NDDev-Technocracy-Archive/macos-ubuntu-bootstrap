schema_version: 1

repository:
  id: "repo_01KX8PR825YW0SJWHW63B3PB8H"
  display_name: "macos-ubuntu-bootstrap"
  roles:
    - "module"
  lifecycle: "active"

provider:
  type: "github"
  installation: "installation:github-organization"
  repository_id: 1288547027
  owner: "NDDev-it-com"
  name: "macos-ubuntu-bootstrap"

classification:
  portfolios:
    - "portfolio:organization-projects"
    - "portfolio:public-modules"
  visibility_contract: "public"
  data_classification: "public"

policy:
  profiles:
    - "repository-default"
    - "organization-default"
    - "public-module"
  rollout_ring: "canary-modules"

git:
  default_branch: "main"
  integration: "pull-request"
  branch_model: "task-branches"
  handoff_pr: "preferred"
  cleanup: "merged-only"

verification:
  commands:
    # What the tests need, established before they run.
    #
    # This lane used to be absent and its work inlined at the top of `test`,
    # which made two different failures look the same. `uv venv` on a host
    # without uv failed before a virtualenv existed; a host with uv but without
    # zsh installed cleanly and then failed inside pytest, at the
    # terminal-portability fixture. Both were reported as "the module failed its
    # tests", and neither was. GitHub CI passed either way, because the reusable
    # Python lane installed what this anchor omitted -- so the declaration that
    # exists to reproduce CI was the one place that did not.
    #
    # `bootstrap` is a prerequisite lane: it runs first, and its failure states
    # that the check could not be attempted. It is deliberately not in
    # `required` -- a module is not verified by having been prepared.
    #
    # One script, called from here and from `.github/workflows/pytest.yml`, so
    # the two cannot describe different environments.
    bootstrap:
      - "bash scripts/ci/setup-test-env.sh"
    test:
      - "bash scripts/ci/validate.sh"
      - ".venv/bin/python -m pytest -q"
  required:
    - "test"
  # The status checks the protected branch actually enforces, as check-run
  # names. Separate from `commands` on purpose: a required context is a check
  # run, not a command, and nothing derives one from the other. Declaring it is
  # what lets the consuming control plane detect drift in either direction --
  # a check the branch gains and the anchor does not name, or a check the anchor
  # claims that the branch no longer requires.
  #
  # `evidence-gate` is deliberately absent: it is in the checked-in projection
  # at .github/rulesets/branch-main.json but not yet in the live ruleset, and
  # this list states what is enforced, not what is intended. See
  # .github/rulesets/README.md for the pending delta.
  required_contexts:
    - "Dependency pin checks"
    - "bootstrap-gate"
    - "bootstrap-pytests"
    - "dependency-review"
    - "workflow-lint"

agent:
  context_profile: "public-module"
  generated_agents: false
  serena:
    enabled: true
    provenance_required: true

module:
  contract: "public"
  consumption:
    - "git-submodule"
  compatibility: "semver"
  pin_policy: "default-branch-commit"
  publication:
    registry: "none"
    github_release: "required"

release:
  mode: "github-release"
